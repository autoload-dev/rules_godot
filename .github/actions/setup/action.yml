name: Set up repository
description: >-
  Install Bazelisk and the Aspect CLI, reuse SDK components, and configure Bazel
  repository caching and cleanup. A fresh Linux runner keeps its repository
  cache on a sticky disk and its missing SDK components in the cache service. A
  persistent runner keeps its tools, SDK components and repository cache on its
  own disk between jobs, shares a Bazel cache server with its host, and its
  machine configures Bazel, so the cache and ~/.bazelrc steps are left out
  there.

runs:
  using: composite
  steps:
    # Blacksmith's runners start every job fresh: the repository cache comes from a
    # sticky disk and Bazel settings go into ~/.bazelrc. A persistent runner, such as
    # the macos-ci runners, keeps its disk between jobs and runs jobs side by side; its
    # machine sets PERSISTENT_RUNNER and BAZEL_REPOSITORY_CACHE in the runner's
    # environment and configures Bazel in /etc/bazel.bazelrc, whose remote cache is the
    # Bazel cache server on the VM's host (autoload-dev/macos-ci). Blacksmith's
    # runners count as self-hosted to GitHub, so runner.environment cannot tell the
    # two kinds apart.
    - name: Classify runner
      id: runner
      shell: bash
      run: |
        fresh=$([[ "${PERSISTENT_RUNNER:-}" == true ]] && echo false || echo true)
        echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
    # Runner images may select an older NDK. Empty values let the Aspect CLI apply the
    # repository default (.aspect/config.axl) while preserving its local override policy.
    - name: Clear runner NDK defaults
      shell: bash
      run: |
        echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
    # The repository's tools are Bazel and the Aspect CLI; everything else comes through
    # Bazel. bootstrap.sh places the pinned Bazelisk and Aspect launcher, verified by the
    # checksums of their releases, as it does in a fresh clone.
    - name: Install Bazelisk and the Aspect CLI
      shell: bash
      run: |
        bin="$RUNNER_TEMP/repository-tools"
        BIN_DIR="$bin" ./bootstrap.sh --tools-only
        echo "$bin" >> "$GITHUB_PATH"
        # The Aspect CLI and its launcher send usage telemetry unless told not to.
        echo "DO_NOT_TRACK=1" >> "$GITHUB_ENV"
    - name: Record runner tool versions
      shell: bash
      run: |
        bazel --version
        aspect version
        clang --version
        if [[ "$RUNNER_OS" == macOS ]]; then
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
        fi
    # Keep normal progress output without collecting per-invocation trace profiles.
    - name: Configure Bazel output
      if: steps.runner.outputs.fresh == 'true'
      shell: bash
      run: |
        {
          echo 'common --generate_json_trace_profile=false'
          echo 'common --show_progress_rate_limit=5'
        } >> "$HOME/.bazelrc"
    # Extracted repositories live under the repository cache and leave it
    # once no build used them for 14 days; a zero idle delay lets Bazel prune
    # them between the job's commands.
    # A persistent runner's machine names its repository cache.
    - name: Locate cache
      id: cache
      shell: bash
      run: |
        cache=${BAZEL_REPOSITORY_CACHE:-$HOME/.cache/bazel-repository}
        echo "path=$cache" >> "$GITHUB_OUTPUT"
        echo "bazelrc=common --repository_cache=$cache --repo_contents_cache_gc_idle_delay=0" >> "$GITHUB_OUTPUT"
    - name: Mount cache from sticky disk
      if: >-
        runner.os == 'Linux'
        && steps.runner.outputs.fresh == 'true'
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ github.repository }}-bazel-repository-${{ runner.os }}-${{ runner.arch }}
        path: ${{ steps.cache.outputs.path }}
    # Bazel refreshes a download's modification time on every cache hit.
    - name: Prune unused downloads
      shell: bash
      env:
        DOWNLOADS: ${{ steps.cache.outputs.path }}/content_addressable
      run: |
        if [[ -d "$DOWNLOADS" ]]; then
          find "$DOWNLOADS" -type f -mtime +30 -delete
          find "$DOWNLOADS" -mindepth 1 -type d -empty -delete
        fi
    - name: Configure repository cache
      if: steps.runner.outputs.fresh == 'true'
      shell: bash
      env:
        REPOSITORY_BAZELRC: ${{ steps.cache.outputs.bazelrc }}
      run: printf '%s\n' "$REPOSITORY_BAZELRC" >> "$HOME/.bazelrc"
    # After the repository cache is configured: finding them builds Bazel's Python.
    - name: Find missing Android SDK components
      if: steps.runner.outputs.fresh == 'true'
      id: sdk-cache
      shell: bash
      run: |
        # In the Aspect CLI's environment, which selects the SDK, with Bazel's Python.
        paths="$(aspect exec -- python3 tools/android/sdk.py --cache-paths)"
        if [[ -n "$paths" ]]; then
          {
            printf 'paths<<SDK_PATHS\n%s\nSDK_PATHS\n' "$paths"
            echo "key=$(printf '%s' "$paths" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
        fi
    - name: Restore missing Android SDK components
      if: steps.sdk-cache.outputs.paths != ''
      uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
      with:
        path: ${{ steps.sdk-cache.outputs.paths }}
        key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-cache.outputs.key }}
    # The web smoke tests start the application in the host's headless Chromium browser, as
    # `bazel run --headless` does; the ruleset downloads none. Runner images usually have
    # Google Chrome; a runner without one gets it here.
    - name: Install a Chromium browser
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          [[ -d "/Applications/Google Chrome.app" ]] || brew install --cask google-chrome
        elif ! for browser in google-chrome google-chrome-stable chromium chrome-headless-shell; do
          command -v "$browser"; done | grep -q .; then
          # Google publishes its Linux package for x86_64 only, as the Linux runner is.
          curl -fsSLo /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome.deb
        fi
    # Persistent workers run from extracted repositories on the disk. Steps
    # clean up in reverse order, so Bazel stops before the disk is unmounted.
    # Only on fresh Linux runners: a persistent runner keeps its Bazel servers
    # warm between jobs, and the step checks the runner again before it acts.
    - name: Stop Bazel at job end
      if: >-
        runner.os == 'Linux'
        && steps.runner.outputs.fresh == 'true'
      uses: ./.github/actions/setup/stop-bazel
      with:
        repository-cache: ${{ steps.cache.outputs.path }}
