name: CI

on:
  pull_request:
  # The merge queue runs every selected lane on the result of the merge. Main
  # then receives that commit unchanged, so a push to main runs nothing again.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# hk.pkl selects tasks for both local verification and CI. The selection job
# avoids provisioning runners for unrelated changes. This workflow runs the
# lanes that Linux runners can run and calls apple.yml for those that need a
# macOS runner, except in a pull request's run: the merge queue runs them, and
# the ci:macos label runs apple.yml for a pull request.
# Policy: docs/internal/verification-platforms.md#apple-lanes-on-pull-requests.

# Blacksmith provisions its Bazel remote cache for build outputs before the job
# starts. Do not layer a disk cache or a second remote cache on top of it;
# .github/actions/setup keeps only Bazel's downloads between runs, on Linux
# with the extracted repositories. The merge queue saves the caches that later
# runs read: Blacksmith's branch protection for the Actions cache and sticky
# disks is off, so every branch reads the entries of a merge group's branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      docs: ${{ steps.plan.outputs.docs }}
      host: ${{ steps.plan.outputs.host }}
      android: ${{ steps.plan.outputs.android }}
      apple: ${{ steps.plan.outputs.apple }}
      apple_plan: ${{ steps.plan.outputs.apple_plan }}
      host_android: ${{ steps.plan.outputs.host_android }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up selection tools
        uses: ./.github/actions/setup
        with:
          bazel: "false"
      - name: Select verification tasks
        id: plan
        run: python3 tools/ci/verification.py plan ci

  formatting:
    name: Source quality
    needs: selection
    if: needs.selection.outputs.quality != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.quality }}
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          bazel-modules: |
            .
            examples
            tests
      - name: Check source quality and setup contracts
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  api-docs:
    name: API documentation
    needs: selection
    if: needs.selection.outputs.docs != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.docs }}
    timeout-minutes: 15
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check API docs
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  tests-linux:
    name: Tests (Linux)
    needs: selection
    if: needs.selection.outputs.host != '[]'
    timeout-minutes: 30
    # Uncached Godot imports and exports are CPU-bound; 4 vCPUs ran 4 at a time.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run host tests
        uses: ./.github/actions/host-tests
        with:
          tasks: ${{ needs.selection.outputs.host }}
          android: ${{ needs.selection.outputs.host_android }}

  android:
    name: Android
    needs: selection
    if: needs.selection.outputs.android != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.android }}
    timeout-minutes: 60
    # Uncached Godot, Java and dex actions are CPU-bound, as in Tests (Linux).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          android-cache: "true"
          bazel-modules: |
            .
            tests
            examples
      - name: Build and inspect apps
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  apple:
    name: Apple
    needs: selection
    if: needs.selection.outputs.apple == 'true'
    uses: ./.github/workflows/apple.yml
    with:
      # The Apple lanes of this run's plan: the Apple workflow does not plan again.
      plan: ${{ needs.selection.outputs.apple_plan }}

  verification:
    name: Finalize
    if: always()
    needs: [selection, formatting, api-docs, tests-linux, android, apple]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected jobs to succeed
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/verification.py verify ci
